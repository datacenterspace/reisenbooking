<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ReisenBooking | Work in Progress</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a5f);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      width: 100%;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 60px 30px;
      backdrop-filter: blur(10px);
    }

    .icon {
      font-size: 60px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #dbeafe;
      margin-bottom: 30px;
    }

    .progress-container {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      overflow: hidden;
      margin: 30px 0;
    }

    .progress-bar {
      width: 65%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
      border-radius: 20px;
      animation: progress 2s ease-in-out infinite alternate;
    }

    @keyframes progress {
      from {
        width: 55%;
      }

      to {
        width: 75%;
      }
    }

    .status {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #7dd3fc;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
    }

    footer {
      margin-top: 40px;
      font-size: 14px;
      color: #94a3b8;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
      }

      .card {
        padding: 45px 20px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="icon">✈️</div>

      <h1>We're Working on Something Amazing!</h1>

      <p>
        Our website is currently under development.
        We are working hard to bring you a better travel
        and booking experience.
      </p>

      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>

      <div class="status">
        🚧 WORK IN PROGRESS
      </div>

    </div>

    <footer>
      © 2026 ReisenBooking.com — All Rights Reserved
    </footer>

  </div>

</body>
</html>
